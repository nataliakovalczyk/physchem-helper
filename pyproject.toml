[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "physchem-helper"
dynamic = ["version"]
description = "Unit-aware physical chemistry helpers for physicists."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Natalia Kowalczyk" }
]
dependencies = [
    "pint>=0.23",
    "numpy>=1.24",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
docs = [
    "pdoc>=14",
]
dev = [
    "physchem-helper[test,docs]",
    "build>=1",
    "twine>=5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/physchem_helper/_version.py"

[tool.pytest.ini_options]
addopts = "--cov=physchem_helper --cov-report=term-missing"
testpaths = ["tests"]